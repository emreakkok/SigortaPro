<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Trafik sigortası - yol ve araç">
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211a20"/>
      <stop offset="1" stop-color="#12100f"/>
    </linearGradient>
    <radialGradient id="t-glow" cx="0.5" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#8c3140" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8c3140" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c262b"/>
      <stop offset="1" stop-color="#181518"/>
    </linearGradient>
    <linearGradient id="t-car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c25667"/>
      <stop offset="1" stop-color="#8c3140"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#t-bg)"/>
  <rect width="400" height="240" fill="url(#t-glow)"/>
  <!-- perspective road -->
  <path d="M150 60 L250 60 L360 220 L40 220 Z" fill="url(#t-road)"/>
  <path d="M150 60 L250 60 L360 220 L40 220 Z" fill="none" stroke="#f0e6dd" stroke-opacity="0.14" stroke-width="2"/>
  <!-- dashed center line -->
  <path d="M200 72 L200 86 M200 104 L200 124 M200 146 L200 172 M200 196 L200 214" stroke="#f0e6dd" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
  <!-- car (front-3/4 simplified) approaching -->
  <g transform="translate(200,150)">
    <ellipse cx="0" cy="52" rx="62" ry="12" fill="#000000" opacity="0.4"/>
    <path d="M-52 34 L-44 -4 Q-42 -16 -28 -18 L28 -18 Q42 -16 44 -4 L52 34 Q54 44 42 44 L-42 44 Q-54 44 -52 34 Z" fill="url(#t-car)"/>
    <path d="M-34 -12 L34 -12 Q40 -12 40 -2 L-40 -2 Q-40 -12 -34 -12 Z" fill="#f0e6dd" opacity="0.9"/>
    <rect x="-40" y="2" width="80" height="10" rx="3" fill="#0e0d0c" opacity="0.3"/>
    <rect x="-46" y="26" width="14" height="9" rx="3" fill="#ffe9b0"/>
    <rect x="32" y="26" width="14" height="9" rx="3" fill="#ffe9b0"/>
    <circle cx="-34" cy="46" r="12" fill="#1a1618" stroke="#c25667" stroke-width="2"/>
    <circle cx="34" cy="46" r="12" fill="#1a1618" stroke="#c25667" stroke-width="2"/>
  </g>
  <!-- traffic sign -->
  <line x1="326" y1="70" x2="326" y2="140" stroke="#6b6169" stroke-width="4"/>
  <circle cx="326" cy="58" r="20" fill="#8c3140" stroke="#c9727f" stroke-width="3"/>
  <rect x="316" y="55" width="20" height="6" rx="3" fill="#f0e6dd"/>
</svg>
