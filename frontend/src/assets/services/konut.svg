<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Konut sigortası - modern ev">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211a20"/>
      <stop offset="1" stop-color="#12100f"/>
    </linearGradient>
    <radialGradient id="h-glow" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#8c3140" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8c3140" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e6dd"/>
      <stop offset="1" stop-color="#d8cabf"/>
    </linearGradient>
    <linearGradient id="h-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c25667"/>
      <stop offset="1" stop-color="#8c3140"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#h-bg)"/>
  <rect width="400" height="240" fill="url(#h-glow)"/>
  <ellipse cx="200" cy="204" rx="160" ry="14" fill="#000000" opacity="0.35"/>
  <line x1="40" y1="200" x2="360" y2="200" stroke="#f0e6dd" stroke-opacity="0.16" stroke-width="2"/>
  <!-- back tall block -->
  <rect x="228" y="96" width="70" height="104" fill="#2c262b"/>
  <rect x="240" y="110" width="16" height="16" fill="#c25667" opacity="0.85"/>
