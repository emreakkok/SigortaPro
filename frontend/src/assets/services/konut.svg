  <rect x="120" y="146" width="26" height="26" rx="2" fill="#2c262b"/>
  <rect x="198" y="146" width="26" height="26" rx="2" fill="#2c262b"/>
  <line x1="133" y1="146" x2="133" y2="172" stroke="#f0e6dd" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="120" y1="159" x2="146" y2="159" stroke="#f0e6dd" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="211" y1="146" x2="211" y2="172" stroke="#f0e6dd" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="198" y1="159" x2="224" y2="159" stroke="#f0e6dd" stroke-opacity="0.5" stroke-width="2"/>
  <!-- protection shield -->
  <path d="M300 128 L326 136 L326 158 Q326 176 300 186 Q274 176 274 158 L274 136 Z" fill="#8c3140" opacity="0.92"/>
