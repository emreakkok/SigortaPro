  <!-- main house -->
  <rect x="108" y="126" width="128" height="74" fill="url(#h-wall)"/>
  <path d="M100 128 L172 78 L244 128 Z" fill="url(#h-roof)"/>
  <path d="M100 128 L172 78 L244 128 Z" fill="none" stroke="#c9727f" stroke-width="2" opacity="0.6"/>
  <!-- door -->
  <rect x="156" y="152" width="32" height="48" rx="2" fill="#8c3140"/>
  <circle cx="181" cy="177" r="2.5" fill="#f0e6dd"/>
