<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Sağlık sigortası - sağlık güvencesi">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211a20"/>
      <stop offset="1" stop-color="#12100f"/>
    </linearGradient>
    <radialGradient id="s-glow" cx="0.7" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#8c3140" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8c3140" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s-heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c25667"/>
      <stop offset="1" stop-color="#8c3140"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#s-bg)"/>
  <rect width="400" height="240" fill="url(#s-glow)"/>
  <!-- soft rounded panel -->
  <rect x="70" y="52" width="260" height="136" rx="20" fill="#2c262b" opacity="0.55"/>
  <!-- heart -->
  <path d="M176 96 Q176 74 152 74 Q126 74 126 102 Q126 132 176 162 Q226 132 226 102 Q226 74 200 74 Q176 74 176 96 Z" fill="url(#s-heart)"/>
  <path d="M176 96 Q176 74 152 74 Q126 74 126 102 Q126 132 176 162 Q226 132 226 102 Q226 74 200 74 Q176 74 176 96 Z" fill="none" stroke="#c9727f" stroke-width="2" opacity="0.7"/>
  <!-- medical cross inside heart -->
  <rect x="166" y="96" width="20" height="44" rx="4" fill="#f0e6dd"/>
  <rect x="154" y="108" width="44" height="20" rx="4" fill="#f0e6dd"/>
  <!-- heartbeat line -->
  <path d="M60 128 L128 128 L146 96 L170 176 L196 128 L214 128" fill="none" stroke="#c25667" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" transform="translate(0,44)"/>
  <path d="M214 172 L340 172" stroke="#c25667" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <!-- shield / plus badge -->
  <path d="M292 72 L320 82 L320 108 Q320 128 292 138 Q264 128 264 108 L264 82 Z" fill="#8c3140" opacity="0.92"/>
  <path d="M292 72 L320 82 L320 108 Q320 128 292 138 Q264 128 264 108 L264 82 Z" fill="none" stroke="#c9727f" stroke-width="2"/>
  <rect x="287" y="90" width="10" height="30" rx="3" fill="#f0e6dd"/>
  <rect x="277" y="100" width="30" height="10" rx="3" fill="#f0e6dd"/>
</svg>
